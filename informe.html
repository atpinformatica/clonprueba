<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Informe Cuatrimestral 2026 — CPEM N° 32</title>
  <style>
    :root {
      --violeta-oscuro: #6d3b8e;
      --violeta-medio:  #8e5aaf;
      --lila-area:      #c9a8dc;
      --lila-mat:       #efe8f5;
      --lila-nota:      #ddd0ec;
      --lila-cab:       #f3ecfa;
      --borde:          #b39cc8;
      --texto-area:     #3d1f5a;
    }

    @page { size: A4 landscape; margin: 10mm 2mm; }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
      color-adjust: exact !important;
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 8pt;
      color: #222;
      background: white;
    }

    .pagina {
      page-break-after: always;
      width: 1107px;
      height: 718px;
      overflow: hidden;
      position: relative;
    }
    .marco-contenido { border: 5px solid var(--violeta-oscuro); border-radius: 4px; padding: 6px; }
    .pagina:last-child { page-break-after: avoid; }

    /* ── CABECERA ── */
    .cabecera {
      display: grid;
      grid-template-columns: 155px 1fr 68px 210px;
      border: 1.5px solid var(--borde);
      margin-bottom: 4px;
      border-radius: 3px;
      overflow: hidden;
    }
    .cab-cpem {
      background-color: var(--violeta-oscuro) !important;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
      color: white !important;
      text-align: center;
      padding: 5px 4px;
      display: flex; flex-direction: column; justify-content: center;
    }
    .cab-cpem .titulo    { font-size: 10pt; font-weight: 700; }
    .cab-cpem .subtitulo { font-size: 7pt; font-weight: 400; margin-top: 1px; opacity: .9; }
    .cab-nombre {
      padding: 0 10px; display: flex; align-items: center;
      font-size: 12pt; font-weight: 700; letter-spacing: 0.3px;
      border-left: 1.5px solid var(--borde); border-right: 1.5px solid var(--borde);
      background-color: var(--lila-cab) !important;
      -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important;
    }
    .cab-curso {
      display: flex; align-items: center; justify-content: center;
      font-size: 13pt; font-weight: 700;
      background-color: var(--lila-nota) !important;
      -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important;
      border-right: 1.5px solid var(--borde); color: var(--texto-area);
    }
    .cab-prece {
      padding: 3px 8px; display: flex; flex-direction: column; justify-content: center;
      background-color: var(--lila-cab) !important;
      -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important;
    }
    .cab-prece .label { font-size: 7pt; color: #777; }
    .cab-prece .valor { font-size: 9.5pt; font-weight: 700; color: var(--texto-area); }

    /* ── TABLA PRINCIPAL ── */
    table.tabla-principal {
      width: 100%; border-collapse: collapse;
      border: 1.5px solid var(--borde);
    }
    table.tabla-principal th, table.tabla-principal > tbody > tr > td {
      border: 1px solid var(--borde);
      padding: 2px 4px; vertical-align: middle;
      word-wrap: break-word; overflow-wrap: break-word;
    }
    .th-main {
      background-color: var(--violeta-oscuro) !important;
      -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important;
      color: white !important; font-size: 7pt; font-weight: 600; text-align: center;
      vertical-align: middle;
    }
    .th-sub {
      background-color: var(--violeta-medio) !important;
      -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important;
      color: white !important; font-size: 6.5pt; font-weight: 600; text-align: center;
    }
    .td-area {
      background-color: var(--lila-area) !important;
      -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important;
      font-weight: 700; font-size: 7pt; text-align: center;
      color: var(--texto-area); width: 115px; vertical-align: middle;
    }
    .td-nota {
      text-align: center; font-weight: 700; font-size: 8.5pt; width: 42px;
      background-color: var(--lila-nota) !important;
      -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important;
      vertical-align: middle;
    }
    .td-val { text-align: center; font-size: 7.5pt; color: #888; }
    .td-val.tiene-valor { color: #222; font-weight: 600; }
    .td-docente { font-size: 7pt; vertical-align: middle; }
    .td-obs { font-size: 7.5pt; line-height: 1.3; padding: 3px 5px; }
    .tr-area td {
      background-color: var(--lila-area) !important;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
      font-weight: 700; font-size: 7.5pt; padding: 4px 8px;
      color: var(--texto-area); text-align: left;
      border-bottom: 1.5px solid var(--borde);
    }
    .td-area-nombre {
      background-color: var(--lila-area) !important;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
      font-weight: 700; font-size: 7pt; text-align: center;
      color: var(--texto-area); vertical-align: middle;
    }

    /* ── TABLAS INTERNAS (materias y obs) ── */
    table.t-mat, table.t-obs {
      width: 100%; border-collapse: collapse; margin: 0;
      table-layout: fixed;
      border: none !important;
    }
    table.t-mat tr td, table.t-obs tr td {
      border: none !important;
      padding: 0;
    }
    .tc-mat {
      padding: 2px 4px !important;
      border-bottom: 1px solid var(--borde) !important;
      font-size: 7.5pt;
      vertical-align: middle;
      background-color: var(--lila-mat) !important;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
      width: 59%;
    }
    .tc-doc {
      padding: 2px 4px !important;
      border-bottom: 1px solid var(--borde) !important;
      border-left: 1px solid var(--borde) !important;
      font-size: 7pt;
      vertical-align: middle;
      width: 41%;
    }
    .tc-obs {
      padding: 2px 5px !important;
      border-bottom: 1.5px solid var(--borde) !important;
      font-size: 7pt;
      vertical-align: middle;
      height: 16px;
      min-height: 16px;
    }
    .tc-obs-nota {
      font-weight: 600;
      background-color: var(--lila-nota) !important;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }
    .obs-label {
      font-weight: 700;
      color: var(--texto-area);
    }
    /* ── FIRMAS ── */
    .firmas {
      display: flex; justify-content: space-between;
      margin-top: 39px; padding: 0 10px;
    }
    .firma-item {
      font-size: 9pt; font-weight: 600; color: var(--texto-area);
      border-top: 1.5px solid var(--texto-area);
      padding-top: 6px; min-width: 200px; text-align: center;
    }

    /* ── ALTERNAR COLORES POR ÁREA ── */
    table.tabla-principal tbody tr.area-par td {
      background-color: #e0d2ed !important;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }
    table.tabla-principal tbody tr.area-impar td {
      background-color: #ffffff !important;
    }
    table.tabla-principal tbody tr.area-par .tc-mat,
    table.tabla-principal tbody tr.area-par .tc-doc {
      background-color: #e0d2ed !important;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }
    table.tabla-principal tbody tr.area-impar .tc-mat,
    table.tabla-principal tbody tr.area-impar .tc-doc {
      background-color: #ffffff !important;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }
    .tc-obs-nota {
      font-weight: 600;
    }

    /* ── BOTÓN IMPRIMIR ── */
    #btn-imprimir {
      position: fixed; bottom: 24px; right: 24px; z-index: 9999;
      background: var(--violeta-oscuro); color: white; border: none;
      padding: 13px 26px; border-radius: 8px; font-size: 12pt; font-weight: bold;
      cursor: pointer; box-shadow: 0 4px 16px rgba(109,59,142,0.4); transition: background 0.2s;
    }
    #btn-imprimir:hover { background: var(--violeta-medio); }
    @media print { #btn-imprimir { display: none !important; } }

    /* ── SPINNER ── */
    #cargando {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; background: white;
      font-size: 14pt; color: var(--violeta-oscuro); gap: 16px; z-index: 999;
    }
    .spinner {
      width: 42px; height: 42px;
      border: 4px solid var(--lila-area); border-top-color: var(--violeta-oscuro);
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="cargando">
    <div class="spinner"></div>
    <span>Cargando informe...</span>
  </div>
  <div id="contenido" style="display:none;"></div>
  <button id="btn-imprimir" style="display:none;" onclick="window.print()">
    🖨️ Imprimir / Guardar PDF
  </button>
  <script>
    window.addEventListener('load', function() {
      try {
        var html = localStorage.getItem('sia_informe_html');
        if (!html || html.trim() === '') {
          document.getElementById('cargando').innerHTML =
            '<p style="color:#c00;font-size:12pt;">⚠️ No hay datos de informe.<br>' +
            '<span style="color:#666;font-size:10pt;">Generá el informe desde el sistema primero.</span></p>';
          return;
        }
        var contenido = document.getElementById('contenido');
        contenido.innerHTML = html;
        contenido.style.display = 'block';
        document.getElementById('cargando').style.display = 'none';
        document.getElementById('btn-imprimir').style.display = 'block';
        localStorage.removeItem('sia_informe_html');
        localStorage.removeItem('sia_informe_ts');

        autoFitPaginas();
      } catch(e) {
        document.getElementById('cargando').innerHTML =
          '<p style="color:#c00;">Error al cargar: ' + e.message + '</p>';
      }
    });

    function autoFitPaginas() {
      var paginas = document.querySelectorAll('.pagina');
      if (!paginas.length) return;
      var pageW = 1107, pageH = 718;
      var MIN_SCALE = 0.5;

      paginas.forEach(function(pag) {
        pag.style.transform = 'none';
        pag.style.transformOrigin = '';
        void pag.offsetHeight;

        var h = pag.scrollHeight;
        var s = Math.min(pageH / h, 1);
        if (s < MIN_SCALE) s = MIN_SCALE;

        if (s < 1) {
          pag.style.transformOrigin = 'top left';
          pag.style.transform = 'scale(' + s + ')';
        }
      });
    }
  </script>
</body>
</html>
